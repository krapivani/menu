name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (shared, native)
        run: cargo clippy -p shared --all-targets -- -D warnings

      - name: cargo test (shared, native)
        run: cargo test -p shared

      - name: cargo clippy (frontend, wasm32)
        run: cargo clippy -p frontend --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      - name: trunk build
        working-directory: frontend
        run: trunk build --release --public-url /menu/
